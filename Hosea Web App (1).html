<title>Hosea Web App</title>
<style>
:root{--bg:#f3f1ff;--card:rgba(255,255,255,.94);--tx:#1b1740;--mu:#6b6890;--pr:#7c3aed;--ok:#16a34a;--bd:#e2defa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(56,189,248,.45),transparent 40%),radial-gradient(circle at 85% 20%,rgba(236,72,153,.5),transparent 42%),linear-gradient(135deg,#1e1b4b 0%,#4338ca 45%,#7c3aed 75%,#c026d3 100%) fixed;color:var(--tx);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 16px;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 4px 14px rgba(124,58,237,.35);color:#fff;cursor:pointer;font-weight:600}
.btn.alt{background:#fff;box-shadow:none;color:var(--tx);border:1px solid var(--bd)}
.btn.w{width:100%;margin-top:8px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:5px 0}
.card{background:var(--card);border:1px solid rgba(255,255,255,.6);border-radius:18px;padding:20px;box-shadow:0 10px 35px rgba(20,10,70,.28);backdrop-filter:blur(8px)}
.auth{max-width:400px;margin:6vh auto;padding:0 16px}
.logo{font-size:32px;font-weight:800;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.3)}.logo span{color:#fde68a}
.sub{text-align:center;color:#e9e5ff;margin:4px 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.err{color:#dc2626;min-height:20px;font-size:13px}
.sep{text-align:center;color:var(--mu);margin:12px 0;font-size:13px}
.g{background:#fff;color:#222;border:1px solid #ddd;box-shadow:none}.f{background:#1877f2;box-shadow:none}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(20,10,70,.25);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;gap:8px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.bar{height:8px;background:#e7e3fb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#06b6d4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.mod{cursor:pointer}.mod{transition:transform .2s}.mod:hover{transform:translateY(-4px);border-color:var(--pr)}.mod h3{margin:6px 0}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.pill.on{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;border-color:transparent}.pill.done{border-color:var(--ok)}
textarea{width:100%;min-height:170px;font:13px/1.4 ui-monospace,Menlo,monospace;background:#0f1226;color:#e6e8ff;border:1px solid var(--bd);border-radius:10px;padding:10px}
iframe{width:100%;height:200px;border:1px solid var(--bd);border-radius:10px;background:#fff}
pre{overflow-x:auto;background:#0f1226;color:#e6e8ff;padding:12px;border-radius:10px;font-size:13px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.opt.good{border-color:var(--ok);background:rgba(22,163,74,.15)}.opt.bad{border-color:#dc2626;background:rgba(220,38,38,.12)}
.hide{display:none}.row{display:flex;gap:8px;align-items:center}.mu{color:var(--mu)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.note{font-size:12px;color:#e9e5ff;margin-top:10px;text-align:center}
</style></head><body>

const H=(b,s="")=>`<!DOCTYPE html><html><body style="font-family:sans-serif">${b}${s?"<script>"+s+"<\/script>":""}</body></html>`;

{i:"🌐",t:"1. HTML Foundations",d:"Structure every web page",ls:[
L("Page structure","HTML (HyperText Markup Language) describes content using tags. Every page has a doctype, html, head and body. Headings (h1–h6), paragraphs, links and images are the core building blocks.",H("<h1>Hello Hosea</h1><p>My first <a href='#'>link</a>.</p>"),"Which tag holds visible page content?",["<head>","<body>","<meta>"],1),
L("Forms & semantic HTML","Use semantic tags (header, nav, main, section, footer) for meaning and SEO. Forms collect input with form, input, label, select and button.",H("<form><label>Name <input placeholder='Your name'></label> <button type='button'>Send</button></form>"),"Which tag is semantic navigation?",["<div>","<nav>","<span>"],1)]},
{i:"🎨",t:"2. CSS Styling",d:"Make it beautiful",ls:[
L("Selectors & box model","CSS styles HTML. Selectors target elements (p, .class, #id). Every element is a box: content, padding, border, margin.",H("<style>.box{padding:20px;border:3px solid #4f46e5;margin:10px;border-radius:12px;background:#eef}</style><div class='box'>Styled box</div>"),"Order from inside to outside of the box model?",["content, padding, border, margin","margin, border, padding, content","border, content, margin, padding"],0),
L("Flexbox & Grid","Flexbox lays out items in one dimension; Grid in two. Use display:flex with justify-content and align-items, or display:grid with grid-template-columns.",H("<style>.r{display:flex;gap:10px;justify-content:space-between}.r div{background:#c7d2fe;padding:16px;border-radius:8px}</style><div class='r'><div>1</div><div>2</div><div>3</div></div>"),"Which property turns on flexbox?",["display:flex","flex:display","layout:flex"],0)]},
{i:"⚡",t:"3. JavaScript",d:"Add behaviour & logic",ls:[
L("Variables & functions","JavaScript is the language of the web. Use const and let for variables, and functions to reuse logic. Types: string, number, boolean, array, object.",H("<p id='o'></p>","const greet=n=>`Hello, ${n}!`;document.getElementById('o').textContent=greet('Hosea');"),"Which keyword declares a constant?",["var","const","def"],1),
L("DOM & events","The DOM is the page as objects. Select elements with querySelector and react to events like click with addEventListener.",H("<button id='b'>Clicked 0</button>","let n=0;const b=document.getElementById('b');b.onclick=()=>{b.textContent='Clicked '+(++n)}"),"Which method listens for a click?",["addEventListener","onListen","attachClick"],0),
L("Async & fetch","Asynchronous code uses Promises and async/await. fetch() requests data from an API and returns a Promise.","async function load(){\n  const r = await fetch('https://api.example.com/users');\n  const data = await r.json();\n  console.log(data);\n}","What does await do?",["Pauses until a Promise resolves","Deletes a Promise","Loops forever"],0,false)]},
{i:"📱",t:"4. Responsive & Accessibility",d:"Work on every device",ls:[
L("Media queries","Responsive design adapts layouts to screen size. Add the viewport meta tag, use relative units (%, rem) and @media queries.",H("<style>div{background:#fca5a5;padding:20px}@media(max-width:500px){div{background:#86efac}}</style><div>Resize me below 500px</div>"),"Which rule applies styles by screen width?",["@media","@screen-size","@responsive"],0),
L("Accessibility (a11y)","Make sites usable for everyone: alt text on images, labels on inputs, good contrast, keyboard navigation, ARIA only when needed.","<img src=\"logo.png\" alt=\"Hosea Tech logo\">\n<button aria-label=\"Close menu\">✕</button>","What attribute describes an image to screen readers?",["title","alt","name"],1,false)]},
{i:"🔧",t:"5. Git & GitHub",d:"Version control",ls:[
L("Core Git commands","Git tracks changes to your code. Commit snapshots, branch to work in isolation, push to GitHub to back up and collaborate.","git init\ngit add .\ngit commit -m \"first commit\"\ngit branch feature-login\ngit checkout feature-login\ngit push origin main","Which command saves a snapshot?",["git commit","git save","git push"],0,false)]},
{i:"🖥️",t:"6. Node.js & Express",d:"Build the backend",ls:[
L("Your first server","Node.js runs JavaScript on the server. Express makes routing simple: define routes that answer HTTP requests with JSON or HTML.","const express = require('express');\nconst app = express();\napp.use(express.json());\napp.get('/api/hello', (req, res) => res.json({ msg: 'Hello Hosea' }));\napp.listen(3000);","Which method handles a GET request in Express?",["app.get","app.fetch","app.read"],0,false)]},
{i:"🗄️",t:"7. Databases & SQL",d:"Store your data",ls:[
L("SQL basics","Relational databases (MySQL, PostgreSQL) store data in tables. SQL queries create, read, update and delete rows. NoSQL (MongoDB) stores documents.","CREATE TABLE users (id INT PRIMARY KEY, name TEXT);\nINSERT INTO users VALUES (1, 'Hosea');\nSELECT * FROM users WHERE id = 1;","Which statement reads data?",["SELECT","FETCH ROWS","GET"],0,false)]},
{i:"🔌",t:"8. APIs & REST",d:"Connect systems",ls:[
L("REST principles","REST APIs use HTTP methods: GET (read), POST (create), PUT/PATCH (update), DELETE (remove). Status codes: 200 OK, 201 Created, 404 Not Found, 500 Server Error.","GET    /api/products\nPOST   /api/products\nPUT    /api/products/5\nDELETE /api/products/5","Which method creates a resource?",["GET","POST","DELETE"],1,false)]},
{i:"⚛️",t:"9. React & Frameworks",d:"Build modern UIs",ls:[
L("Components & state","React builds UIs from reusable components. State (useState) holds data that changes; when it changes, the UI re-renders.","function Counter(){\n  const [n, setN] = React.useState(0);\n  return <button onClick={() => setN(n+1)}>Clicked {n}</button>;\n}","What hook stores component state?",["useState","useData","useStore"],0,false)]},
{i:"🔐",t:"10. Security & Authentication",d:"Protect users",ls:[
L("Web security essentials","Always use HTTPS, hash passwords (bcrypt/argon2), validate input, escape output to stop XSS, use parameterised queries to stop SQL injection, and use OAuth for Google/Facebook login.","// Never: db.query(\"SELECT * FROM u WHERE id=\" + id)\n// Always:\ndb.query('SELECT * FROM u WHERE id = ?', [id]);","How should passwords be stored?",["Plain text","Hashed","Base64"],1,false)]},
{i:"🚀",t:"11. Deployment & Hosting",d:"Go live",ls:[
L("Going live","Buy a domain, point DNS to a host (Netlify, Vercel, cPanel, VPS), enable SSL and automate deploys from GitHub. Test on mobile before launch and monitor uptime.","1. Push code to GitHub\n2. Connect repo to host\n3. Add custom domain + SSL\n4. Deploy & test","What does SSL provide?",["Faster CSS","Encrypted HTTPS","Free images"],1,false)]},
{i:"💼",t:"12. Career & Freelancing",d:"Turn skills into income",ls:[
L("Build a portfolio","Build 3–5 real projects, host them live, keep a GitHub profile, and show results for clients. Offer packages (landing page, business site, web app), set clear scopes and take deposits.","Portfolio checklist:\n- 3+ live projects\n- Clean GitHub README files\n- Contact page + WhatsApp link\n- Client testimonials","What proves your skill best?",["Certificates only","Live projects","Social media likes"],1,false)]}

// ===== Storage helpers =====
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let mem={users:{},sess:null,prog:{}};
const users=()=>S.get("hwa_users",mem.users),saveUsers=u=>{mem.users=u;S.set("hwa_users",u)};
let user=S.get("hwa_session",null),prog={},view="home",mi=0,li=0,mode="in";
const prk=()=>"hwa_prog_"+user.email;
const loadProg=()=>{prog=S.get(prk(),{})},saveProg=()=>S.set(prk(),prog);
async function hash(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hosea:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(p)}}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// ===== Auth =====
function authView(){
$("#app").innerHTML=`<div class="auth"><div class="logo">Hosea <span>Web App</span></div><p class="sub">Learn web development from zero to deployed</p>
<div class="card"><div class="tabs"><button class="btn ${mode=="in"?"":"alt"}" onclick="mode='in';authView()">Sign in</button><button class="btn ${mode=="up"?"":"alt"}" onclick="mode='up';authView()">Create account</button></div>
${mode=="up"?'<input id="nm" placeholder="Full name" autocomplete="name">':""}
<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
<div class="err" id="er"></div><button class="btn w" onclick="submitAuth()">${mode=="in"?"Sign in":"Create account"}</button>
<div class="sep">— or continue with —</div>
<button class="btn w g" onclick="social('Google')"><b style="color:#4285f4">G</b> Continue with Google</button>
<button class="btn w f" onclick="social('Facebook')"><b>f</b> Continue with Facebook</button></div>
<p class="note">Accounts are stored securely on this device. © Hosea Technology</p></div>`}
async function submitAuth(){
const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value,nm=($("#nm")||{}).value,er=$("#er"),u=users();
if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent="Enter a valid email.";
if(pw.length<6)return er.textContent="Password must be at least 6 characters.";
const h=await hash(pw);
if(mode=="up"){if(!nm||!nm.trim())return er.textContent="Enter your name.";if(u[em])return er.textContent="Account already exists. Sign in instead.";u[em]={name:nm.trim(),h,p:"email"};saveUsers(u)}
else{if(!u[em]||u[em].h!==h)return er.textContent="Wrong email or password."}
login(em,u[em].name)}
function social(p){
const m=document.createElement("div");m.className="modal";
m.innerHTML=`<div class="card" style="max-width:360px;width:100%"><h3 style="margin-top:0">Continue with ${p}</h3><p class="mu">Confirm the ${p} account to sign in with.</p><input id="sn" placeholder="Name"><input id="se" type="email" placeholder="${p} email"><div class="err" id="se2"></div><button class="btn w" id="ok">Continue</button><button class="btn alt w" id="cx">Cancel</button></div>`;
document.body.appendChild(m);m.querySelector("#cx").onclick=()=>m.remove();
m.querySelector("#ok").onclick=()=>{const n=m.querySelector("#sn").value.trim(),e=m.querySelector("#se").value.trim().toLowerCase();
if(!n||!/^\S+@\S+\.\S+$/.test(e))return m.querySelector("#se2").textContent="Enter name and a valid email.";
const u=users();if(!u[e])u[e]={name:n,h:"",p:p};saveUsers(u);m.remove();login(e,u[e].name)}}
function login(email,name){user={email,name};S.set("hwa_session",user);loadProg();view="home";render()}
function logout(){user=null;S.set("hwa_session",null);mode="in";render()}
// ===== App =====
const total=MODS.reduce((a,m)=>a+m.ls.length,0),doneCount=()=>Object.keys(prog).length,key=(a,b)=>a+"-"+b;
function render(){if(!user)return authView();
const pc=Math.round(doneCount()/total*100);
$("#app").innerHTML=`<header><b style="font-size:17px">Hosea <span style="background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent">Web App</span></b><div class="row"><span class="mu">${esc(user.name.split(" ")[0])}</span><button class="btn alt" onclick="view='home';render()">Home</button><button class="btn alt" onclick="logout()">Sign out</button></div></header><div class="wrap" id="main"></div>`;
view=="home"?home(pc):lesson()}
function home(pc){
$("#main").innerHTML=`<div class="card"><h2 style="margin:0 0 4px">Welcome, ${esc(user.name)} 👋</h2><p class="mu" style="margin:0 0 10px">${doneCount()} of ${total} lessons completed (${pc}%)</p><div class="bar"><i style="width:${pc}%"></i></div></div>
<div class="grid">${MODS.map((m,i)=>{const d=m.ls.filter((_,j)=>prog[key(i,j)]).length;return`<div class="card mod" onclick="mi=${i};li=0;view='lesson';render()"><div style="font-size:28px">${m.i}</div><h3>${m.t}</h3><div class="mu">${m.d}</div><div class="bar" style="margin-top:10px"><i style="width:${d/m.ls.length*100}%"></i></div><small class="mu">${d}/${m.ls.length} lessons</small></div>`}).join("")}</div>`}
function lesson(){
const m=MODS[mi],l=m.ls[li];
$("#main").innerHTML=`<h2 style="margin:0;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3)">${m.i} ${m.t}</h2>
<div class="nav">${m.ls.map((x,j)=>`<button class="pill ${j==li?"on":""} ${prog[key(mi,j)]?"done":""}" onclick="li=${j};render()">${prog[key(mi,j)]?"✓ ":""}${esc(x.t)}</button>`).join("")}</div>
<div class="card"><h3 style="margin-top:0">${esc(l.t)}</h3><p>${l.body}</p>
${l.run?`<textarea id="ed" spellcheck="false"></textarea><div class="row" style="margin:8px 0"><button class="btn" onclick="run()">▶ Run code</button><span class="mu">Edit the code and run it live</span></div><iframe id="fr" sandbox="allow-scripts"></iframe>`:`<pre id="pre"></pre>`}
<h4>Quick check</h4><p><b>${esc(l.q)}</b></p>${l.o.map((o,k)=>`<button class="opt" onclick="ans(this,${k})">${esc(o)}</button>`).join("")}
<div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn alt" onclick="step(-1)">← Previous</button><button class="btn" onclick="step(1)">Next →</button></div></div>`;
if(l.run){$("#ed").value=l.code;run()}else $("#pre").textContent=l.code}
function run(){$("#fr").srcdoc=$("#ed").value}
function ans(b,k){const l=MODS[mi].ls[li];document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
if(k==l.a){b.classList.add("good");prog[key(mi,li)]=1;saveProg()}else{b.classList.add("bad");document.querySelectorAll(".opt")[l.a].classList.add("good")}
setTimeout(()=>{const s=document.querySelectorAll(".pill")[li];if(s&&prog[key(mi,li)]){s.classList.add("done");s.textContent="✓ "+l.t}},0)}
function step(d){li+=d;if(li<0){if(mi>0){mi--;li=MODS[mi].ls.length-1}else{li=0}}else if(li>=MODS[mi].ls.length){if(mi<MODS.length-1){mi++;li=0}else{view="home"}}render();scrollTo(0,0)}
if(user)loadProg();render();
</script></body></html>
